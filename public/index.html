<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Channel Auth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0a0f1d; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #151f32; border: 1px solid #23324d; border-radius: 20px; padding: 32px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
    h2 { font-size: 22px; margin-bottom: 6px; }
    p.sub { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
    .channel-group { display: flex; gap: 8px; margin-bottom: 20px; }
    .channel-btn { flex: 1; padding: 10px 4px; border-radius: 10px; border: 1px solid #334155; background: #0a0f1d; color: #94a3b8; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .channel-btn.active { background: #6366f1; color: #fff; border-color: #6366f1; font-weight: 600; }
    input { width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid #334155; background: #0a0f1d; color: #fff; font-size: 15px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #6366f1; }
    .btn { width: 100%; padding: 14px; background: #6366f1; border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .otp-inputs { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
    .otp-box { width: 45px; height: 50px; text-align: center; font-size: 20px; font-weight: bold; border-radius: 8px; border: 1px solid #334155; background: #0a0f1d; color: #fff; }
    .msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .msg-error { color: #f87171; }
    .msg-success { color: #4ade80; }
  </style>
</head>
<body>

  <!-- STEP 1: SEND OTP -->
  <div class="card" id="step-send">
    <h2>Multi-Channel Auth</h2>
    <p class="sub">Choose where you want your verification OTP</p>

    <div class="channel-group">
      <button class="channel-btn" onclick="selectChannel('email')" id="btn-email">✉️ Email</button>
      <button class="channel-btn" onclick="selectChannel('telegram')" id="btn-telegram">✈️ Telegram</button>
      <button class="channel-btn active" onclick="selectChannel('whatsapp')" id="btn-whatsapp">💬 WhatsApp</button>
    </div>

    <input type="text" id="target-input" placeholder="Enter Phone Number (e.g. 9926888306)" />
    <button class="btn" id="send-btn" onclick="sendOtp()">Send OTP</button>
    <div class="msg" id="send-msg"></div>
  </div>

  <!-- STEP 2: VERIFY OTP -->
  <div class="card" id="step-verify" style="display: none;">
    <h2>Verification Code</h2>
    <p class="sub" id="verify-sub">Code sent to your destination</p>

    <div class="otp-inputs">
      <input type="text" maxlength="1" class="otp-box" oninput="moveNext(this, 0)" />
      <input type="text" maxlength="1" class="otp-box" oninput="moveNext(this, 1)" />
      <input type="text" maxlength="1" class="otp-box" oninput="moveNext(this, 2)" />
      <input type="text" maxlength="1" class="otp-box" oninput="moveNext(this, 3)" />
      <input type="text" maxlength="1" class="otp-box" oninput="moveNext(this, 4)" />
      <input type="text" maxlength="1" class="otp-box" oninput="moveNext(this, 5)" />
    </div>

    <button class="btn" id="verify-btn" onclick="verifyOtp()">Verify Code</button>
    <div style="margin-top: 14px;"><a href="#" onclick="location.reload()" style="color: #818cf8; font-size: 13px; text-decoration: none;">Resend OTP</a></div>
    <div class="msg" id="verify-msg"></div>
  </div>

  <!-- STEP 3: DASHBOARD -->
  <div class="card" id="step-dash" style="display: none;">
    <div style="font-size: 40px; margin-bottom: 10px;">🎉</div>
    <h2>Authenticated!</h2>
    <p class="sub">You are successfully logged in</p>
    <div style="background: #0a0f1d; padding: 14px; border-radius: 10px; text-align: left; font-size: 13px; color: #94a3b8; line-height: 1.6; margin-bottom: 20px;">
      <div>Target: <b id="dash-user" style="color: #fff;"></b></div>
      <div>Channel: <b id="dash-channel" style="color: #fff;"></b></div>
      <div>Role: <b id="dash-role" style="color: #4ade80;">Member</b></div>
    </div>
    <button class="btn" onclick="logout()">Sign Out</button>
  </div>

  <script>
    let activeChannel = 'whatsapp';
    let currentTarget = '';

    function selectChannel(ch) {
      activeChannel = ch;
      document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + ch).classList.add('active');
      const input = document.getElementById('target-input');
      input.placeholder = ch === 'email' ? 'Enter Email (e.g. name@gmail.com)' : (ch === 'telegram' ? 'Enter Telegram Chat ID' : 'Enter Phone (e.g. 9926888306)');
    }

    async function sendOtp() {
      const input = document.getElementById('target-input');
      const btn = document.getElementById('send-btn');
      const msg = document.getElementById('send-msg');
      currentTarget = input.value.trim();

      if (!currentTarget) {
        msg.className = 'msg msg-error';
        msg.textContent = 'Please enter valid detail';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';
      msg.textContent = '';

      try {
        const res = await fetch('/api/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: currentTarget, channel: activeChannel })
        });
        const data = await res.json();

        if (res.ok) {
          document.getElementById('step-send').style.display = 'none';
          document.getElementById('step-verify').style.display = 'block';
          document.getElementById('verify-sub').textContent = `Code sent to ${currentTarget}`;
          document.querySelectorAll('.otp-box')[0].focus();
        } else {
          msg.className = 'msg msg-error';
          msg.textContent = data.error || 'Failed to dispatch OTP';
        }
      } catch (e) {
        msg.className = 'msg msg-error';
        msg.textContent = 'Network / Server Error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send OTP';
      }
    }

    function moveNext(el, idx) {
      const boxes = document.querySelectorAll('.otp-box');
      if (el.value && idx < 5) boxes[idx + 1].focus();
    }

    async function verifyOtp() {
      const boxes = document.querySelectorAll('.otp-box');
      const otp = Array.from(boxes).map(b => b.value).join('');
      const msg = document.getElementById('verify-msg');
      const btn = document.getElementById('verify-btn');

      if (otp.length < 6) {
        msg.className = 'msg msg-error';
        msg.textContent = 'Enter complete 6-digit code';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Verifying...';

      try {
        const res = await fetch('/api/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: currentTarget, otp })
        });
        const data = await res.json();

        if (res.ok) {
          document.getElementById('step-verify').style.display = 'none';
          document.getElementById('step-dash').style.display = 'block';
          document.getElementById('dash-user').textContent = data.user.identifier;
          document.getElementById('dash-channel').textContent = data.user.channel.toUpperCase();
        } else {
          msg.className = 'msg msg-error';
          msg.textContent = data.error || 'Invalid code';
        }
      } catch (e) {
        msg.className = 'msg msg-error';
        msg.textContent = 'Verification error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Verify Code';
      }
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
