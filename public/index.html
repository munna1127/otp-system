<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Channel Auth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0a0f1d; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #151f32; border: 1px solid #23324d; border-radius: 20px; padding: 32px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
    h2 { font-size: 22px; margin-bottom: 6px; }
    p.sub { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
    .channel-group { display: flex; gap: 8px; margin-bottom: 20px; }
    .channel-btn { flex: 1; padding: 10px 4px; border-radius: 10px; border: 1px solid #334155; background: #0a0f1d; color: #94a3b8; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .channel-btn.active { background: #6366f1; color: #fff; border-color: #6366f1; font-weight: 600; }
    input { width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid #334155; background: #0a0f1d; color: #fff; font-size: 15px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #6366f1; }
    .btn { width: 100%; padding: 14px; background: #6366f1; border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-tg { background: #0284c7; margin-top: 10px; }
    .otp-inputs { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
    .otp-box { width: 45px; height: 50px; text-align: center; font-size: 20px; font-weight: bold; border-radius: 8px; border: 1px solid #334155; background: #0a0f1d; color: #fff; }
    .msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .msg-error { color: #f87171; }
  </style>
</head>
<body>

  <div class="card" id="step-send">
    <h2>Multi-Channel Auth</h2>
    <p class="sub">Choose where you want your verification OTP</p>

    <div class="channel-group">
      <button class="channel-btn active" onclick="selectChannel('email')" id="btn-email">✉️ Email</button>
      <button class="channel-btn" onclick="selectChannel('telegram')" id="btn-telegram">✈️ Telegram</button>
      <button class="channel-btn" onclick="selectChannel('whatsapp')" id="btn-whatsapp">💬 WhatsApp</button>
    </div>

    <input type="text" id="target-input" placeholder="Enter Email/Phone" />
    <button class="btn" id="send-btn" onclick="sendOtp()">Send OTP</button>
    <div class="msg" id="send-msg"></div>
  </div>

  <div class="card" id="step-verify" style="display: none;">
    <h2>Verification Code</h2>
    <p class="sub" id="verify-sub">Code sent</p>
    
    <a href="https://t.me/Otp_maaster_bot" target="_blank" id="tg-btn" class="btn btn-tg" style="display: none;">✈️ Open Telegram Bot</a>

    <div class="otp-inputs" style="margin-top: 20px;">
      <input type="text" maxlength="1" class="otp-box" oninput="moveNext(this, 0)" />
      <input type="text" maxlength="1" class="otp-box" oninput="moveNext(this, 1)" />
      <input type="text" maxlength="1" class="otp-box" oninput="moveNext(this, 2)" />
      <input type="text" maxlength="1" class="otp-box" oninput="moveNext(this, 3)" />
      <input type="text" maxlength="1" class="otp-box" oninput="moveNext(this, 4)" />
      <input type="text" maxlength="1" class="otp-box" oninput="moveNext(this, 5)" />
    </div>

    <button class="btn" id="verify-btn" onclick="verifyOtp()">Verify Code</button>
    <div class="msg" id="verify-msg"></div>
  </div>

  <script>
    let activeChannel = 'email';
    let currentTarget = '';

    function selectChannel(ch) {
      activeChannel = ch;
      document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + ch).classList.add('active');
    }

    async function sendOtp() {
      const input = document.getElementById('target-input');
      const msg = document.getElementById('send-msg');
      currentTarget = input.value.trim();

      try {
        const res = await fetch('/api/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: currentTarget, channel: activeChannel })
        });
        const data = await res.json();

        if (res.ok) {
          document.getElementById('step-send').style.display = 'none';
          document.getElementById('step-verify').style.display = 'block';
          
          // Telegram button always show if channel is telegram
          if (activeChannel === 'telegram') {
            document.getElementById('tg-btn').style.display = 'block';
          }
        } else {
          msg.textContent = data.error;
        }
      } catch (e) { msg.textContent = 'Server Error'; }
    }

    function moveNext(el, idx) { if (el.value && idx < 5) document.querySelectorAll('.otp-box')[idx + 1].focus(); }

    async function verifyOtp() {
      const otp = Array.from(document.querySelectorAll('.otp-box')).map(b => b.value).join('');
      const res = await fetch('/api/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier: currentTarget, otp })
      });
      if (res.ok) alert('Verified!'); else alert('Invalid');
    }
  </script>
</body>
</html>
